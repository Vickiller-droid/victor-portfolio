<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Boothy · Gmail delivery setup</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f7f4ed;color:#292720;font:17px/1.65 system-ui,sans-serif}main{max-width:660px;margin:8vh auto;padding:28px}h1{font:2.5rem/1.15 Georgia,serif}a{color:#ad4724}button{font:inherit;font-weight:600;cursor:pointer;padding:14px 22px;background:#ad4724;color:#fff;border:0;border-radius:8px}button:disabled{opacity:.6;cursor:wait}#result{margin-top:24px;padding:18px;background:#fffaf2;border:1px solid #ddd6ca;border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere}.label{font-size:.8rem;letter-spacing:.12em;color:#ad4724;font-weight:700}
  </style>
</head>
<body>
<main>
  <p class="label">BOOTHY / EMAIL SETUP</p>
  <h1>Connect signup notifications.</h1>
  <p>This requests FormSubmit activation for <strong>alabivictordaniel@gmail.com</strong> from Victor’s live portfolio.</p>
  <p>After activation, the same button sends a delivery test. It does not add a subscriber to the waitlist.</p>
  <form id="setup-form" action="https://formsubmit.co/alabivictordaniel@gmail.com" method="POST">
    <input type="hidden" name="name" value="Boothy waitlist delivery setup">
    <input type="hidden" name="email" value="alabivictordaniel@gmail.com">
    <input type="hidden" name="message" value="Delivery test from Victor’s live portfolio. This is not a subscriber signup.">
    <input type="hidden" name="_subject" value="Boothy waitlist: live portfolio delivery test">
    <input type="hidden" name="_url" value="https://victor-portfolio-olive.vercel.app/">
    <input type="hidden" name="_template" value="table">
    <button type="submit">Send setup test</button>
  </form>
  <div id="result" role="status" aria-live="polite">Ready.</div>
  <p><a href="/">Back to the portfolio</a></p>
</main>
<script>
  if(location.origin!=='https://victor-portfolio-olive.vercel.app'){
    document.querySelector('button').disabled=true;
    document.getElementById('result').textContent='Open this page on the live portfolio address to request the correct activation.';
  }
</script>
</body>
</html>
