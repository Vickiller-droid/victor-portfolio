<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>You're offline | Victor Alabi</title>
<script>
  try {
    const theme = localStorage.getItem("victor-portfolio-theme");
    if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
  } catch {}
</script>
<style>
  :root { color-scheme:light; --paper:#f6f3ee; --ink:#292622; --muted:#6d665e; --accent:#a4472c; --line:#dcd3c8 }
  :root[data-theme=dark] { color-scheme:dark; --paper:#211f1c; --ink:#f4efe8; --muted:#b7ada1; --accent:#ec9c7c; --line:#494139 }
  @media (prefers-color-scheme:dark) {
    :root:not([data-theme]) { color-scheme:dark; --paper:#211f1c; --ink:#f4efe8; --muted:#b7ada1; --accent:#ec9c7c; --line:#494139 }
  }
  * { box-sizing:border-box }
  body { margin:0; min-height:100vh; min-height:100svh; padding:0 clamp(20px,7vw,112px); display:grid; grid-template-rows:auto 1fr; background:var(--paper); color:var(--ink); font-family:"DM Sans",system-ui,-apple-system,sans-serif }
  header { padding:22px 0; border-bottom:1px solid var(--line); font-weight:750; letter-spacing:-.045em }
  header span { color:var(--accent) }
  main { align-self:center; width:100%; max-width:560px; margin:auto; text-align:center; padding:24px 0 34px }
  .scene { width:min(100%,380px); margin:0 auto 20px; color:var(--ink) }
  .scene svg { display:block; width:100%; height:auto; shape-rendering:crispEdges }
  .scene .accent { fill:var(--accent) }
  .scene .ink { fill:currentColor }
  .scene .ground { stroke:currentColor; stroke-width:2; stroke-dasharray:48 8 5 14; opacity:.58 }
  .scene .cloud { stroke:currentColor; stroke-width:2; fill:none; opacity:.42 }
  h1 { font:500 clamp(1.75rem,5.8vw,2.45rem)/1.14 "Newsreader",Georgia,serif; letter-spacing:-.035em; margin:0 auto; max-width:510px; text-wrap:balance }
  p { color:var(--muted); max-width:360px; margin:12px auto 20px; font-size:clamp(.9rem,2.8vw,1rem); line-height:1.55; text-wrap:pretty }
  button { min-height:42px; border:0; border-radius:6px; padding:0 20px; background:#a4472c; color:#fff; font:600 .9rem "DM Sans",system-ui,sans-serif; cursor:pointer }
  button:hover { filter:brightness(1.08) }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:4px }
  .status { margin-top:15px; color:var(--muted); font-size:.68rem; letter-spacing:.07em; text-transform:uppercase }
  @media (prefers-reduced-motion:no-preference) { .dino { animation:bob 2.2s ease-in-out infinite } @keyframes bob { 50% { transform:translateY(-3px) } } }
  @media (max-width:420px) { header { padding:18px 0 } main { padding:18px 0 28px } .scene { width:min(100%,330px); margin-bottom:18px } h1 { max-width:330px; font-size:clamp(1.7rem,7.4vw,2rem) } p { max-width:320px; font-size:.9rem } }
  @media (max-height:700px) { main { padding:12px 0 20px } .scene { width:min(100%,280px); margin-bottom:12px } }
</style>
</head>
<body>
<header>victoralabi<span>.</span></header>
<main>
  <div class="scene" aria-hidden="true">
    <svg viewBox="0 0 490 210" xmlns="http://www.w3.org/2000/svg">
      <path class="cloud" d="M52 54h14V44h12V34h20v10h14v10h24 M350 43h16V31h14V21h24v10h14v12h22"/>
      <g class="dino ink" transform="translate(151 48)">
        <path d="M32 0h62v12h12v42H82v12H64v24H48v15H34V90H20V78H8V66H0V42h12v12h12V30h8z"/>
        <path d="M32 89h13v34H32zM63 89h13v34H63z"/>
        <path d="M6 78H-6V66h-12V54h-10v34h12v12H4z"/>
        <rect x="77" y="14" width="8" height="8" fill="var(--paper)"/>
        <rect x="87" y="41" width="19" height="7" fill="var(--paper)"/>
      </g>
      <g class="accent">
        <rect x="325" y="107" width="9" height="51"/><rect x="316" y="128" width="9" height="9"/><rect x="308" y="113" width="9" height="16"/><rect x="334" y="119" width="9" height="10"/><rect x="343" y="108" width="9" height="12"/>
        <rect x="91" y="145" width="5" height="12"/><rect x="85" y="149" width="5" height="5"/>
      </g>
      <path class="ground" d="M25 171H465"/>
      <g class="ink"><rect x="260" y="166" width="5" height="4"/><rect x="287" y="179" width="10" height="3"/><rect x="404" y="165" width="7" height="4"/><rect x="120" y="178" width="8" height="3"/></g>
    </svg>
  </div>
  <h1>Even the dinosaur couldn't outrun this connection.</h1>
  <p>Looks like the internet went AWOL. Give it another shot.</p>
  <button type="button" onclick="location.reload()">Try again</button>
  <div class="status" role="status">Offline · Waiting for connection</div>
</main>

</body>
</html>
